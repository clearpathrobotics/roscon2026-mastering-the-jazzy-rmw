# teleop_twist_joy params for mecanum (holonomic) drive — matches the teleop
# node under any robot namespace. Unlike the differential-drive config, the left
# stick commands translation on both x and y, and the right stick commands yaw.
#   Left stick  Y (axis 1) -> linear.x   (+x / -x)
#   Left stick  X (axis 0) -> linear.y   (+y / -y)
#   Right stick X (axis 2) -> angular.yaw (+yaw / -yaw)
# require_enable_button is disabled so joystick axes drive the robot without a
# deadman button held. Adjust axis/button indices to match your gamepad layout.
/**/teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true
    require_enable_button: false
    enable_button: 0
    enable_turbo_button: -1
    axis_linear.x: 1
    scale_linear.x: 0.5
    scale_linear_turbo.x: 1.0
    axis_linear.y: 0
    scale_linear.y: 0.5
    scale_linear_turbo.y: 1.0
    axis_angular.yaw: 2
    scale_angular.yaw: 1.0
