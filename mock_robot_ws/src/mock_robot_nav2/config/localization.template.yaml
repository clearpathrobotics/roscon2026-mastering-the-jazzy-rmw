# AMCL + map_server params template for the mock robots.
# Rendered by mock_robot_nav2/launch_utils.render_params:
#   ${frame_id}          -> TF prefix (e.g. robot1)
#   ${amcl_motion_model} -> nav2_amcl::DifferentialMotionModel | ::OmniMotionModel
# scan_topic is relative and resolves under the pushed robot namespace.
# The initial pose is seeded at identity: the mock spawns at the world origin and
# the map is built from there, so map == odom == base_link at t0 (see mock_robot_nav2.md §10.3).
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "${frame_id}/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "${frame_id}/map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "${frame_id}/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "${amcl_motion_model}"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    yaml_filename: ""
    # Publish the map in the namespaced TF frame so it matches world_to_map and AMCL's global_frame_id.
    frame_id: "${frame_id}/map"

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
