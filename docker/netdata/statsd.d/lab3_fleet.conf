[app]
    name = lab3_fleet
    metrics = lab3_fleet.*
    private charts = no
    gaps when not collected = yes

# RTPS multicast transmitted by each container. This captures actual discovery
# traffic emitted by the participant, not bridge-flooded packets it receives.
[multicast_tx]
    name = multicast_tx
    title = Lab 3 Fleet RTPS Discovery Multicast TX
    family = Config comparison
    context = lab3.fleet.multicast_tx
    units = packets/s
    priority = 92000
    type = line
    dimension = lab3_fleet.multicast_tx.observer observer-hub last 1 1
    dimension = lab3_fleet.multicast_tx.mock_robot_1 robot-1-spoke last 1 1
    dimension = lab3_fleet.multicast_tx.mock_robot_2 robot-2-spoke last 1 1
    dimension = lab3_fleet.multicast_tx.mock_robot_3 robot-3-spoke last 1 1

[multicast_total]
    name = multicast_total
    title = Lab 3 Fleet Default-Group Discovery Multicast TX
    family = Config comparison
    context = lab3.fleet.multicast_total
    units = packets/s
    priority = 92001
    type = line
    dimension = lab3_fleet.multicast_tx.default_group_total default-group-total last 1 1

# Replica count makes the aggregate dimensions interpretable.
[default_group_size]
    name = default_group_size
    title = Lab 3 Fleet Default-Config Replicas
    family = Config comparison
    context = lab3.fleet.default_group_size
    units = containers
    priority = 92002
    type = line
    dimension = lab3_fleet.default_group_size replicas last 1 1

